  <script>

    (function() {
    const init = () => {
        // 1. Try to find the canvas
        let canvas = document.getElementById('splash-cursor-canvas');

        // 2. If it's not there, create it automatically
        if (!canvas) {
            canvas = document.createElement('canvas');
            canvas.id = 'splash-cursor-canvas';
            document.body.appendChild(canvas);
        }

        // 3. Apply the necessary styles via JS to be safe
        Object.assign(canvas.style, {
            position: 'fixed',
            top: '0',
            left: '0',
            width: '100vw',
            height: '100vh',
            pointerEvents: 'none',
            zIndex: '9999'
        });

        const ctx = canvas.getContext('2d');
        let particles = [];

        const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        // 4. The bubble logic you liked
        window.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 2; i++) {
                particles.push({
                    x: e.clientX,
                    y: e.clientY,
                    s: Math.random() * 5 + 5, 
                    vx: (Math.random() - 0.5) * 1.8,
                    vy: (Math.random() - 0.5) * 1.8,
                    a: 0.7 
                });
            }
        });

        const animate = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#eef5ff';
            
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.a -= 0.012;
                p.s -= 0.05;

                if (p.a <= 0 || p.s <= 0.1) {
                    particles.splice(i, 1);
                    i--;
                    continue;
                }

                ctx.globalAlpha = p.a;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s, 0, 6.28);
                ctx.fill();
            }
            requestAnimationFrame(animate);
        };

        animate();
    };

    // Run when the page is ready
    if (document.readyState === 'complete') {
        init();
    } else {
        window.addEventListener('load', init);
    }
})();

  </script>
